<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetPoint Café — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .manage-tabs {
    display: flex; gap: 4px; background: var(--bg-elevated); padding: 4px;
    border-radius: var(--radius-md); border: 1px solid var(--border); width: fit-content; margin-bottom: 24px;
  }
  .manage-tabs button { background: transparent; border: none; color: var(--text-muted); padding: 8px 18px; border-radius: var(--radius-sm); font-size: 0.875rem; cursor: pointer; }
  .manage-tabs button.active { background: var(--surface-hover); color: var(--accent); }
  .add-btn { background: var(--accent); border: 1px solid var(--accent); color: #1A1300; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; cursor: pointer; }
  .add-btn:hover { background: #FFC61A; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  .data-table th { text-align: left; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-muted); }
  .data-table td.mono { font-family: var(--font-mono); color: var(--text-primary); }
  .data-table tr:hover td { background: var(--surface); }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: var(--radius-sm); font-size: 0.75rem; cursor: pointer; }
  .row-actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .row-actions .delete-btn:hover { border-color: var(--status-occupied); color: var(--status-occupied); }
  .low-stock { color: var(--status-occupied); }

  .sell-panel {
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 22px;
  }
  .sell-panel h3 { font-size: 1rem; margin-bottom: 4px; }
  .sell-panel .modal-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 18px; }
  .pay-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .pay-toggle button {
    flex: 1; padding: 9px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 0.8rem; cursor: pointer;
  }
  .pay-toggle button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">NetPoint<span>.</span></div>
      <span class="brand-sub">Point of Sale</span>
    </div>
    <div class="nav-tabs">
      <button onclick="window.location.href='dashboard.html'">Dashboard</button>
      <button onclick="window.location.href='manage.html'">Manage</button>
      <button class="active">POS</button>
    </div>
    <div class="user-chip">
      <span class="user-name">Signed in as <strong id="staffName">—</strong></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <main>
    <div class="manage-tabs">
      <button id="tabSell" class="active">Sell</button>
      <button id="tabProducts">Products</button>
      <button id="tabSalesHistory">Sales History</button>
    </div>

    <!-- Sell panel -->
    <section id="panelSell">
      <div class="sell-panel">
        <h3>New Sale</h3>
        <p class="modal-sub">Ring up a snack, drink, or accessory.</p>

        <div class="field">
          <label>Product</label>
          <select id="sell_product"></select>
        </div>
        <div class="field">
          <label>Quantity</label>
          <input type="number" id="sell_qty" value="1" min="1">
        </div>
        <div class="field">
          <label>Customer (required for Wallet payment)</label>
          <select id="sell_customer">
            <option value="">Walk-in / no account</option>
          </select>
        </div>
        <div class="field">
          <label>Payment method</label>
          <div class="pay-toggle">
            <button type="button" class="active" data-method="Cash" id="payCashBtn">Cash</button>
            <button type="button" data-method="Wallet" id="payWalletBtn">Wallet</button>
          </div>
        </div>

        <div class="receipt" id="sellReceipt" style="display:none; margin-bottom: 14px;"></div>

        <button class="btn btn-primary" id="sellConfirmBtn" style="width:100%;">Complete Sale</button>
      </div>
    </section>

    <!-- Products panel -->
    <section id="panelProducts" style="display:none;">
      <div class="section-head">
        <h2>Products</h2>
        <button class="add-btn" id="addProductBtn">+ Add Product</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="productsBody"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </section>

    <!-- Sales history panel -->
    <section id="panelSalesHistory" style="display:none;">
      <div class="section-head">
        <h2>Sales History</h2>
        <span class="section-count" id="salesCount"></span>
      </div>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Subtotal</th><th>Payment</th></tr></thead>
        <tbody id="salesBody"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <!-- Product add/edit modal -->
  <div class="modal-overlay" id="productModal" hidden>
    <div class="modal">
      <h3 id="productModalTitle">Add Product</h3>
      <p class="modal-sub">Item details</p>
      <div class="field"><label>Product Name</label><input type="text" id="pf_name" placeholder="Chips"></div>
      <div class="field"><label>Category</label><input type="text" id="pf_category" placeholder="Snack"></div>
      <div class="field"><label>Price</label><input type="number" id="pf_price" step="0.01" min="0" placeholder="25.00"></div>
      <div class="field"><label>Stock Quantity</label><input type="number" id="pf_stock" min="0" placeholder="50"></div>
      <div class="modal-actions">
        <button class="btn" id="productCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="productSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/pos.js"></script>
</body>
</html>
